<div class="form-container">
    <h2>{{ isEditMode() ? 'Edit' : 'Create' }} Book</h2>
    
    <form [formGroup]="bookForm" (ngSubmit)="save()">
    <div class="form-group">
        <label>Title</label>
        <input formControlName="title" type="text" />
    </div>

    <div class="form-group">
        <label>Author</label>
        <input formControlName="author" type="text" />
    </div>

    <div class="form-group">
        <label>Category</label>
        <input formControlName="category" type="text" />
    </div>

    <div class="form-group">
        <label>Published Year</label>
        <input formControlName="publishedYear" type="number" />
        @if(bookForm.get('publishedYear')?.errors?.['pattern']) {
            <span class="error">Must be 4 digits</span>
        }
    </div>

    <div class="form-group-chk">
        <label>
        <input formControlName="available" type="checkbox" />
        Available for loan
        </label>
    </div>

    <div class="actions">
        <a routerLink="/books" class="btn-cancel">Cancel</a>
        <button type="submit" [disabled]="bookForm.invalid || isSaving()">
        {{ isSaving() ? 'Saving...' : 'Save Book' }}
        </button>
    </div>
    </form>
</div>
