<div class="login-container">
  <h2>Library Login</h2>
  <form [formGroup]="_loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Email</label>
      <input formControlName="email" type="email" placeholder="Enter Email" />
      @if (_loginForm.get('email')?.touched && _loginForm.get('email')?.invalid) {
        <span class="error">Email is required</span>
      }
    </div>

    <div class="form-group">
      <label>Password</label>
      <input formControlName="password" type="password" placeholder="Enter Password" />
      @if (_loginForm.get('password')?.touched && _loginForm.get('password')?.invalid) {
        <span class="error">Password is required</span>
      }
    </div>

    @if (errorMessage()) {
      <div class="alert-error">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="_loginForm.invalid">Login</button>
  </form>
</div>
