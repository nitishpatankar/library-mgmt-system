<h2>Members Directory</h2>
<app-grid 
    [data]="members()" 
    [columns]="tableCols" 
    [isLoading]="loading()">

    <ng-template #actions let-member>
        <span [style.color]="member.active ? 'green' : 'gray'">
        {{ member.active ? 'Active' : 'Inactive' }}
        </span>
    </ng-template>
</app-grid>
