@if (authService.currentUser()) {
    <header class="app-header">
        <div class="brand">LMS 2026</div>
        <nav>
            <a routerLink="/books" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">
                Books
            </a>
            
            <a routerLink="/members" routerLinkActive="active-link">
                Members
            </a>
        </nav>
        <div class="user-info">
            <span>Welcome, {{ authService.currentUser()?.name }}</span>
            <button (click)="logout()">Logout</button>
        </div>
    </header>
}

<main class="main-content">
    <router-outlet></router-outlet>
</main>
